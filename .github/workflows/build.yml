name: "Build and release Philips Titan OS package"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHON_VER: 3.11.12-0.3.0

concurrency:
  group: philips-titanos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read manifest and determine release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.version' driver.json)"
          DRIVER_ID="$(jq -r '.driver_id' driver.json)"
          TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DRIVER_ID=$DRIVER_ID" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=uc-intg-${DRIVER_ID}-${VERSION}-aarch64" >> "$GITHUB_ENV"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
            echo "Release $TAG already exists; build will still be validated."
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
            echo "Release $TAG will be created after a successful build."
          fi

      - name: Build AArch64 driver
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker run --rm \
            --platform=aarch64 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c "cd /workspace && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --name intg-${DRIVER_ID} \
                --collect-all ucapi \
                --collect-all ucapi_framework \
                --collect-all zeroconf \
                intg_philips_titanos/__main__.py"

      - name: Prepare package
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/bin
          mv "dist/intg-${DRIVER_ID}/"* artifacts/bin/
          mv "artifacts/bin/intg-${DRIVER_ID}" artifacts/bin/driver
          chmod 755 artifacts/bin/driver
          cp driver.json artifacts/
          cp assets/philips-titanos-logo.png artifacts/

      - name: Validate
        shell: bash
        run: |
          test -f artifacts/driver.json
          test -f artifacts/philips-titanos-logo.png
          python - <<'PY'
          import struct
          from pathlib import Path
          logo = Path("artifacts/philips-titanos-logo.png")
          with logo.open("rb") as file:
              signature = file.read(8)
              if signature != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("philips-titanos-logo.png is not a valid PNG")
              length = struct.unpack(">I", file.read(4))[0]
              chunk = file.read(4)
              if chunk != b"IHDR" or length < 8:
                  raise SystemExit("philips-titanos-logo.png has no valid IHDR chunk")
              width, height = struct.unpack(">II", file.read(8))
          if (width, height) != (90, 90):
              raise SystemExit(f"philips-titanos-logo.png must be 90x90, got {width}x{height}")
          print(f"Logo validated: {width}x{height}")
          PY
          test -x artifacts/bin/driver
          test ! -e artifacts/bin/_internal/driver.json
          python -m compileall -q intg_philips_titanos
          jq -e --arg v "$VERSION" '.driver_id == "philips_titanos" and .version == $v' artifacts/driver.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          expected = "custom:philips-titanos-logo.png"
          entity = Path("intg_philips_titanos/remote.py").read_text(encoding="utf-8")
          assert expected in entity
          assert "HDMI_DISCOVERY" in entity
          print("Entity icon and HDMI-1 raw-key diagnostics validated")
          PY

      - name: Create Remote 3 archive
        shell: bash
        run: |
          cd artifacts
          tar czf "../${ARTIFACT_NAME}.tar.gz" ./philips-titanos-logo.png ./driver.json ./bin/
          cd ..
          tar tzf "${ARTIFACT_NAME}.tar.gz" | sed -n '1,30p'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release automatically
        if: github.event_name == 'push' && env.RELEASE_EXISTS == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "${ARTIFACT_NAME}.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "Philips Titan OS ${RELEASE_TAG}" \
            --generate-notes \
            --latest \
            --repo "$GITHUB_REPOSITORY"

      - name: Existing release notice
        if: github.event_name == 'push' && env.RELEASE_EXISTS == 'true'
        shell: bash
        run: |
          echo "Release ${RELEASE_TAG} already exists."
          echo "Increase driver.json version before the next release."
