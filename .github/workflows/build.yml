name: "Build Philips Titan OS package"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read manifest
        shell: bash
        run: |
          echo "VERSION=$(jq -r '.version' driver.json)" >> "$GITHUB_ENV"
          echo "DRIVER_ID=$(jq -r '.driver_id' driver.json)" >> "$GITHUB_ENV"

      - name: Build AArch64 driver
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker run --rm             --platform=aarch64             --user=$(id -u):$(id -g)             -v "${GITHUB_WORKSPACE}:/workspace"             docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER}             bash -c "cd /workspace &&               python -m pip install -r requirements.txt &&               pyinstaller --clean --onedir --name intg-${DRIVER_ID}                 --collect-all ucapi                 --collect-all ucapi_framework                 --collect-all zeroconf                 intg_philips_titanos/__main__.py"

      - name: Prepare package
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/bin
          mv "dist/intg-${DRIVER_ID}/"* artifacts/bin/
          mv "artifacts/bin/intg-${DRIVER_ID}" artifacts/bin/driver
          chmod 755 artifacts/bin/driver
          cp driver.json artifacts/
          cp assets/driver-logo.png artifacts/
          echo "ARTIFACT_NAME=uc-intg-${DRIVER_ID}-${VERSION}-aarch64" >> "$GITHUB_ENV"

      - name: Validate
        shell: bash
        run: |
          test -f artifacts/driver.json
          test -f artifacts/driver-logo.png
          python - <<'PY'
          import struct
          from pathlib import Path

          logo = Path("artifacts/driver-logo.png")
          with logo.open("rb") as file:
              signature = file.read(8)
              if signature != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("driver-logo.png is not a valid PNG")
              length = struct.unpack(">I", file.read(4))[0]
              chunk = file.read(4)
              if chunk != b"IHDR" or length < 8:
                  raise SystemExit("driver-logo.png has no valid IHDR chunk")
              width, height = struct.unpack(">II", file.read(8))
          if (width, height) != (90, 90):
              raise SystemExit(f"driver-logo.png must be 90x90, got {width}x{height}")
          print(f"Logo validated: {width}x{height}")
          PY
          test -x artifacts/bin/driver
          test ! -e artifacts/bin/_internal/driver.json
          test -f artifacts/driver.json
          python - <<'PY'
          from pathlib import Path
          init_file = Path("intg_philips_titanos/__init__.py").read_text(encoding="utf-8")
          assert "Path(sys.executable).resolve().parent / \"driver.json\"" in init_file
          print("Runtime manifest lookup validated")
          PY
          python - <<'PY'
          from pathlib import Path
          source = Path("intg_philips_titanos/setup_flow.py").read_text(encoding="utf-8")
          assert "import socket" in source, "setup_flow.py uses socket but does not import it"
          compile(source, "setup_flow.py", "exec")
          print("Setup flow imports and syntax validated")
          PY
          jq -e '.driver_id == "philips_titanos" and .version == "0.8.8"' artifacts/driver.json >/dev/null

      - name: Create Remote 3 archive
        shell: bash
        run: |
          cd artifacts
          tar czf "../${ARTIFACT_NAME}.tar.gz" ./driver-logo.png ./driver.json ./bin/
          cd ..
          tar tzf "${ARTIFACT_NAME}.tar.gz" | sed -n '1,30p'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 7
